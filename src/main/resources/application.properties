server.port=8080
spring.application.name=payment-ledger-reconciliation

# 本地内嵌 H2，数据全部落本地文件，不依赖任何外部服务
spring.datasource.url=jdbc:h2:file:./data/paymentledger;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.level.com.github.lechandonga=INFO
